[project]
name = "benchmark-ts-clustering"
version = "0.1.0"
description = "Benchmark for time series clustering"
readme = "README.md"
authors = [
    { name = "pierre farsa", email = "pierre.farsa@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "aeon>=1.6.0",
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
    "numba>=0.63.1",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "pytorch-lightning>=2.6.6",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "umap-learn>=0.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "seaborn>=0.13.2",
]
